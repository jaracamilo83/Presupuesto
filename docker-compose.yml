services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD_ROOT}"
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      
  asp_mvc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: presupuestos_mvc
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings_DefaultConnection: "Server=mysql;Database=${DB_NAME};User=${DB_USERNAME};Password=${DB_PASSWORD};TrustServerCertificate=True;"
      
volumes:
  mysql_data: